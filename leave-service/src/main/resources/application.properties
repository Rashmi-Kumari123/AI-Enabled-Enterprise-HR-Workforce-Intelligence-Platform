spring.application.name=leave-service
server.port=${PORT:${SERVER_PORT:8085}}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nexus_leave_db?sslmode=disable}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

app.jwt.secret=${JWT_SECRET:yPZl/g1HfzCIKrRuuCOcdOjcLUfb4xEdgdGgSu1tToe8jovFisN9877lPwHX61jmtYuBZ8iuqWHclKMk/13psA==}

app.services.employee-url=${EMPLOYEE_SERVICE_URL:http://localhost:8082}
app.employee.internal-key=${EMPLOYEE_INTERNAL_KEY:nexushr-internal-dev-key}

app.notifications.enabled=${NOTIFICATIONS_ENABLED:true}
app.notifications.url=${NOTIFICATION_SERVICE_URL:http://localhost:8089}
app.notifications.internal-key=${NOTIFICATION_INTERNAL_KEY:nexushr-internal-dev-key}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
