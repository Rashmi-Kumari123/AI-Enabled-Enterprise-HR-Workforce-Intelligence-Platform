spring.datasource.url=jdbc:h2:mem:payroll_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

spring.flyway.enabled=false

app.jwt.secret=local-dev-secret-change-before-production-min-32-chars

app.payroll.working-days-per-month=22
app.payroll.pf-rate-percent=12
app.payroll.pf-max-amount=1800
app.payroll.professional-tax-amount=200
app.payroll.professional-tax-threshold=15000
app.payroll.income-tax-rate-percent=10

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
