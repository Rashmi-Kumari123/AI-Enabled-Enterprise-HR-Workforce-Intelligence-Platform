spring.application.name=notification-service
server.port=${PORT:${SERVER_PORT:8089}}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nexus_notification_db?sslmode=prefer}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

app.jwt.secret=${JWT_SECRET:yPZl/g1HfzCIKrRuuCOcdOjcLUfb4xEdgdGgSu1tToe8jovFisN9877lPwHX61jmtYuBZ8iuqWHclKMk/13psA==}
app.notifications.internal-key=${NOTIFICATION_INTERNAL_KEY:nexushr-internal-dev-key}

# Email (MailHog default: localhost:1025, UI http://localhost:8025)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}

app.notifications.email.enabled=${NOTIFICATION_EMAIL_ENABLED:true}
app.notifications.email.from=${NOTIFICATION_EMAIL_FROM:nexushr@localhost}

app.notifications.manager-emails=${NOTIFICATION_MANAGER_EMAILS:manager@nexushr.com,hr@nexushr.com}

app.notifications.reminders.enabled=${NOTIFICATION_REMINDERS_ENABLED:true}
app.notifications.reminders.pending-hours=${NOTIFICATION_REMINDER_PENDING_HOURS:24}
app.notifications.reminders.cron=${NOTIFICATION_REMINDER_CRON:0 0 9 * * *}

app.services.leave-url=${LEAVE_SERVICE_URL:http://localhost:8085}
app.services.leave-internal-key=${LEAVE_INTERNAL_KEY:nexushr-internal-dev-key}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
