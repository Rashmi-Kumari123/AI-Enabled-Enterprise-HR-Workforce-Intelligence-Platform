spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Access-Control-Allow-Headers Access-Control-Allow-Methods Vary
            - AddResponseHeader=X-Content-Type-Options, nosniff
            - AddResponseHeader=X-Frame-Options, DENY
            - AddResponseHeader=Referrer-Policy, strict-origin-when-cross-origin
            - AddResponseHeader=X-XSS-Protection, 0
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origin-patterns: http://localhost:*,http://127.0.0.1:*
                allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
                allowed-headers: "*"
                max-age: 3600
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**
            - id: employee-service
              uri: ${EMPLOYEE_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/employees/**
            - id: payroll-service
              uri: ${PAYROLL_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/payroll/**
            - id: attendance-service
              uri: ${ATTENDANCE_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/attendance/**
            - id: leave-service
              uri: ${LEAVE_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/leaves/**
            - id: performance-service
              uri: ${PERFORMANCE_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/v1/performance/**
            - id: ai-insights-service
              uri: ${AI_INSIGHTS_SERVICE_URL:http://localhost:8088}
              predicates:
                - Path=/api/v1/ai/**
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8089}
              predicates:
                - Path=/api/v1/notifications/**
            - id: notification-websocket
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8089}
              predicates:
                - Path=/ws-notifications/**
server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    export:
      prometheus:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
