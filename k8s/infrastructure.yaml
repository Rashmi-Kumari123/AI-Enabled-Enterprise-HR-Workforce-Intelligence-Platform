# In-cluster PostgreSQL + Redis for EKS demo/staging.
# Uses emptyDir (no PVC) to fit t3.small nodes; data resets if postgres pod restarts.
# For production, use RDS — see scripts/aws/setup-rds.sh
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: nexushr
data:
  init-databases.sql: |
    CREATE DATABASE nexus_auth_db;
    CREATE DATABASE nexus_employee_db;
    CREATE DATABASE nexus_payroll_db;
    CREATE DATABASE nexus_attendance_db;
    CREATE DATABASE nexus_leave_db;
    CREATE DATABASE nexus_performance_db;
    CREATE DATABASE nexus_ai_insights_db;
    CREATE DATABASE nexus_notification_db;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: nexushr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: nexushr-config
                  key: DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nexushr-secrets
                  key: DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: data
          emptyDir: {}
        - name: init
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: nexushr
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: nexushr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          args: ["--save", "", "--appendonly", "no"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: nexushr
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
