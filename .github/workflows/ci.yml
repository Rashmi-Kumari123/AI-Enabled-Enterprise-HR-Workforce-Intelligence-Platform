name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'nexushr-prod' }}
  ECR_PREFIX: nexushr

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Run tests
        run: mvn -B verify -DskipITs=false

  frontend:
    name: Frontend (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    name: Docker build (smoke)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build auth-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.spring-service
          build-args: SERVICE_MODULE=auth-service
          push: false
          tags: nexushr/auth-service:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          tags: nexushr/frontend:ci

  deploy:
    name: Deploy to AWS EKS
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for module in api-gateway auth-service employee-service attendance-service leave-service payroll-service performance-service ai-insights-service notification-service; do
            uri="${REGISTRY}/${ECR_PREFIX}-${module}"
            docker build -f docker/Dockerfile.spring-service \
              --build-arg "SERVICE_MODULE=${module}" \
              -t "${uri}:latest" \
              -t "${uri}:${IMAGE_SHA}" \
              .
            docker push "${uri}:latest"
            docker push "${uri}:${IMAGE_SHA}"
          done

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "${EKS_CLUSTER_NAME}" --region "${AWS_REGION}"

      - name: Apply Kubernetes manifests
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GRAFANA_PASSWORD: ${{ secrets.GRAFANA_PASSWORD }}
        run: |
          set -euo pipefail
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          if [ -n "${DB_PASSWORD}" ]; then
            kubectl create secret generic nexushr-secrets -n nexushr \
              --from-literal=DB_PASSWORD="${DB_PASSWORD}" \
              --from-literal=GRAFANA_PASSWORD="${GRAFANA_PASSWORD:-admin}" \
              --dry-run=client -o yaml | kubectl apply -f -
          fi
          kubectl apply -f k8s/infrastructure.yaml
          sed "s|nexushr/|${REGISTRY}/${ECR_PREFIX}-|g" k8s/deployments.yaml | kubectl apply -f -
          kubectl apply -f k8s/hpa.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Build and push frontend (gateway API URLs)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          GATEWAY_HOST="$(kubectl get svc api-gateway -n nexushr -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)"
          GATEWAY_URL="http://${GATEWAY_HOST:-localhost:8080}"
          uri="${REGISTRY}/${ECR_PREFIX}-frontend"
          docker build -f frontend/Dockerfile \
            --build-arg "VITE_AUTH_API_URL=${GATEWAY_URL}" \
            --build-arg "VITE_EMPLOYEE_API_URL=${GATEWAY_URL}" \
            --build-arg "VITE_ATTENDANCE_API_URL=${GATEWAY_URL}" \
            --build-arg "VITE_LEAVE_API_URL=${GATEWAY_URL}" \
            --build-arg "VITE_PAYROLL_API_URL=${GATEWAY_URL}" \
            --build-arg "VITE_PERFORMANCE_API_URL=${GATEWAY_URL}" \
            --build-arg "VITE_NOTIFICATION_API_URL=${GATEWAY_URL}" \
            --build-arg "VITE_AI_INSIGHTS_API_URL=${GATEWAY_URL}" \
            -t "${uri}:latest" \
            -t "${uri}:${IMAGE_SHA}" \
            frontend
          docker push "${uri}:latest"
          docker push "${uri}:${IMAGE_SHA}"
          kubectl set image deployment/frontend frontend="${uri}:latest" -n nexushr
          kubectl rollout restart deployment/frontend -n nexushr
          kubectl rollout restart deployment/api-gateway -n nexushr

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/auth-service -n nexushr --timeout=360s || true
          kubectl rollout status deployment/api-gateway -n nexushr --timeout=360s
          kubectl rollout status deployment/frontend -n nexushr --timeout=180s
