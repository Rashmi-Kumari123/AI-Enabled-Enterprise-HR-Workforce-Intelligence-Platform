spring.datasource.url=jdbc:h2:mem:attendance_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

spring.flyway.enabled=false
spring.sql.init.mode=always

app.jwt.secret=local-dev-secret-change-before-production-min-32-chars

app.notifications.enabled=false
app.notifications.url=http://localhost:8089
app.notifications.internal-key=test-internal-key

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
