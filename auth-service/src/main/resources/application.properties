spring.application.name=auth-service
server.port=${PORT:${SERVER_PORT:8081}}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nexus_auth_db?sslmode=disable}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

app.jwt.secret=${JWT_SECRET:yPZl/g1HfzCIKrRuuCOcdOjcLUfb4xEdgdGgSu1tToe8jovFisN9877lPwHX61jmtYuBZ8iuqWHclKMk/13psA==}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

app.session.cache.enabled=${SESSION_CACHE_ENABLED:true}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

app.services.employee-url=${EMPLOYEE_SERVICE_URL:http://localhost:8082}
app.employee.internal-key=${EMPLOYEE_INTERNAL_KEY:nexushr-internal-dev-key}
app.demo.seed-enabled=${DEMO_SEED_ENABLED:true}
