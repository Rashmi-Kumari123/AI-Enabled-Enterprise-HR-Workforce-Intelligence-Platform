spring.application.name=notification-service-test
server.port=0

spring.datasource.url=jdbc:h2:mem:notification_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.secret=test-secret-key-for-notification-service-min-32-chars
app.notifications.internal-key=test-internal-key

app.notifications.email.enabled=false
app.notifications.reminders.enabled=false

spring.mail.host=localhost
spring.mail.port=1025

springdoc.swagger-ui.enabled=false
