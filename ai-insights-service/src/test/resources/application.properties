spring.application.name=ai-insights-service-test
server.port=0

spring.datasource.url=jdbc:h2:mem:ai_insights_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.notifications.enabled=false

spring.ai.model.chat=none
spring.ai.model.embedding=none

app.jwt.secret=test-secret-key-for-ai-insights-service-min-32-chars

app.services.employee-url=http://localhost:8082
app.services.attendance-url=http://localhost:8084
app.services.leave-url=http://localhost:8085
app.services.performance-url=http://localhost:8086

app.ai.openai.enabled=false
app.ai.huggingface.enabled=false

springdoc.swagger-ui.enabled=false
