spring.application.name=employee-service
server.port=8082

# PostgreSQL DB Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nexus_employee_db?sslmode=disable}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JWT (same secret as auth-service for token validation)
app.jwt.secret=${JWT_SECRET:yPZl/g1HfzCIKrRuuCOcdOjcLUfb4xEdgdGgSu1tToe8jovFisN9877lPwHX61jmtYuBZ8iuqWHclKMk/13psA==}

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Multipart uploads (identity / tax documents)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_REQUEST_SIZE:12MB}
server.tomcat.max-http-form-post-size=${UPLOAD_MAX_REQUEST_SIZE:12MB}

app.services.leave-url=${LEAVE_SERVICE_URL:http://localhost:8085}
app.leave.internal-key=${LEAVE_INTERNAL_KEY:nexushr-internal-dev-key}
app.auth.internal-key=${AUTH_INTERNAL_KEY:nexushr-internal-dev-key}
app.services.auth-url=${AUTH_SERVICE_URL:http://localhost:8081}

app.notifications.enabled=${NOTIFICATIONS_ENABLED:true}
app.notifications.url=${NOTIFICATION_SERVICE_URL:http://localhost:8089}
app.notifications.internal-key=${NOTIFICATION_INTERNAL_KEY:nexushr-internal-dev-key}

app.upload.dir=${UPLOAD_DIR:./uploads}
