spring.application.name=ai-insights-service
server.port=${PORT:${SERVER_PORT:8088}}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nexus_ai_insights_db?sslmode=disable}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

app.notifications.enabled=${NOTIFICATIONS_ENABLED:true}
app.notifications.url=${NOTIFICATION_SERVICE_URL:http://localhost:8089}
app.notifications.internal-key=${NOTIFICATION_INTERNAL_KEY:nexushr-internal-dev-key}

app.reports.scheduler.enabled=${REPORT_SCHEDULER_ENABLED:true}
app.reports.scheduler.cron=${REPORT_SCHEDULER_CRON:0 0 8 * * *}

# Disable Spring AI auto-config; models are registered manually when enabled
spring.ai.model.chat=none
spring.ai.model.embedding=none

app.jwt.secret=${JWT_SECRET:yPZl/g1HfzCIKrRuuCOcdOjcLUfb4xEdgdGgSu1tToe8jovFisN9877lPwHX61jmtYuBZ8iuqWHclKMk/13psA==}

# Downstream NexusHR services (JWT forwarded from caller)
app.services.employee-url=${EMPLOYEE_SERVICE_URL:http://localhost:8082}
app.services.attendance-url=${ATTENDANCE_SERVICE_URL:http://localhost:8084}
app.services.leave-url=${LEAVE_SERVICE_URL:http://localhost:8085}
app.services.performance-url=${PERFORMANCE_SERVICE_URL:http://localhost:8086}

# OpenAI via Spring AI (primary)
app.ai.openai.enabled=${OPENAI_ENABLED:false}
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=0.2

# Hugging Face via Spring AI (fallback when OpenAI disabled)
app.ai.huggingface.enabled=${HUGGINGFACE_ENABLED:false}
spring.ai.huggingface.api-key=${HUGGINGFACE_API_KEY:}
spring.ai.huggingface.chat.options.model=${HUGGINGFACE_MODEL:meta-llama/Meta-Llama-3-8B-Instruct}
spring.ai.huggingface.chat.options.temperature=0.2

app.ai.skills.target-score=4.0

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
