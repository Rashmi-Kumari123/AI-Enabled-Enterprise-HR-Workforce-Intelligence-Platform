apiVersion: v1
kind: ConfigMap
metadata:
  name: nexushr-config
  namespace: nexushr
data:
  JWT_SECRET: change-me-in-production-min-32-chars-long
  DB_USERNAME: postgres
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  NOTIFICATION_INTERNAL_KEY: nexushr-internal-dev-key
  LEAVE_INTERNAL_KEY: nexushr-internal-dev-key
  EMPLOYEE_INTERNAL_KEY: nexushr-internal-dev-key
  AUTH_SERVICE_URL: http://auth-service:8081
  EMPLOYEE_SERVICE_URL: http://employee-service:8082
  PAYROLL_SERVICE_URL: http://payroll-service:8083
  ATTENDANCE_SERVICE_URL: http://attendance-service:8084
  LEAVE_SERVICE_URL: http://leave-service:8085
  PERFORMANCE_SERVICE_URL: http://performance-service:8086
  AI_INSIGHTS_SERVICE_URL: http://ai-insights-service:8088
  NOTIFICATION_SERVICE_URL: http://notification-service:8089
  APP_SERVICES_EMPLOYEE_URL: http://employee-service:8082
  APP_NOTIFICATIONS_URL: http://notification-service:8089
  APP_SERVICES_LEAVE_URL: http://leave-service:8085
  APP_SERVICES_ATTENDANCE_URL: http://attendance-service:8084
  APP_SERVICES_PERFORMANCE_URL: http://performance-service:8086
  MAIL_HOST: mailhog
  MAIL_PORT: "1025"
  JPA_SHOW_SQL: "false"
  # AWS S3 document storage (production — see deploy/aws/README.md)
  APP_STORAGE_PROVIDER: local
  AWS_S3_BUCKET: ""
  AWS_REGION: ap-south-1
